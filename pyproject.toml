[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-lens"
version = "0.1.0"
description = "Passive SDLC artifact collector and read-only observability API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
sdlc-lens = "sdlc_lens.cli:main"

[tool.setuptools.packages.find]
include = ["sdlc_lens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
